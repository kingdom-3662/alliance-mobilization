name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'alliance-mobilization.xlsx'
      - 'build.py'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate data.js
        run: python build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact with cache-busting asset version
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          mkdir -p site
          cp index.html styles.css app.js data.js site/
          sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g" site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
